[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papercast"
version = "0.1.0"
description = "AI 논문 리뷰 팟캐스트 자동 생성 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PaperCast" }]

dependencies = [
    "claude-agent-sdk>=0.1.0",
    "google-genai>=1.70.0",
    "arxiv>=2.1.0",
    "pypdf>=4.3.0",
    "pdf2image>=1.17.0",
    "pymupdf>=1.24.0",
    "Pillow>=10.4.0",
    "numpy>=1.24.0",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[project.scripts]
papercast = "src.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
